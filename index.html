<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SKY STRIKE — Cockpit Combat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }
  canvas { display: block; cursor: none; touch-action: none; }
  body { font-family: monospace; -webkit-user-select: none; user-select: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;

// Two independent flags: one for touch capability, one for whether the user is actively using touch
let touchCapable = false;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  touchCapable = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  updateTouchButtonPositions();
}

const F = 600;

// ================== STATE ==================
let state = 'intro';
let score = 0, health = 100, kills = 0, wave = 1;
let bombs = 5, maxBombs = 5;
let enemies = [], bullets = [], bombs_proj = [], explosions = [], particles = [], clouds = [];
let crosshair = { x: 0, y: 0 };
let mouseX = 0, mouseY = 0;
let keys = {};
let lastTime = 0, gameTime = 0;
let spawnTimer = 0, fireCooldown = 0, bombCooldown = 0;
let shake = 0, flash = 0;
let highScore = parseInt(localStorage.getItem('skyStrikeHigh') || '0');

// ================== TOUCH BUTTONS ==================
const touchButtons = {
  fire: { x: 0, y: 0, r: 0, pressed: false },
  bomb: { x: 0, y: 0, r: 0, pressed: false }
};

function updateTouchButtonPositions() {
  const btnR = Math.max(45, Math.min(W, H) * 0.09);
  touchButtons.fire.r = btnR;
  touchButtons.fire.x = W - btnR - 25;
  touchButtons.fire.y = H - btnR - 25;

  touchButtons.bomb.r = btnR;
  touchButtons.bomb.x = btnR + 25;
  touchButtons.bomb.y = H - btnR - 25;
}

function isPointInButton(px, py, btn) {
  return Math.hypot(px - btn.x, py - btn.y) < btn.r * 1.25;
}

// ================== CLOUDS ==================
function initClouds() {
  clouds = [];
  for (let i = 0; i < 30; i++) {
    clouds.push({
      x: Math.random() * (W + 300) - 150,
      y: Math.random() * H * 0.65,
      r: 40 + Math.random() * 160,
      speed: 15 + Math.random() * 50,
      alpha: 0.08 + Math.random() * 0.2
    });
  }
}

function resetPosition() {
  crosshair.x = W / 2;
  crosshair.y = H / 2;
  mouseX = W / 2;
  mouseY = H / 2;
}

window.addEventListener('resize', () => {
  resize();
  initClouds();
});
resize();
initClouds();
updateTouchButtonPositions();
resetPosition();

// ================== AUDIO ==================
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
}
function playShoot() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.06);
  g.gain.setValueAtTime(0.04, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.09);
}
function playBoom() {
  if (!audioCtx) return;
  const bs = audioCtx.sampleRate * 0.35;
  const buf = audioCtx.createBuffer(1, bs, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bs; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bs, 2);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.value = 0.25;
  src.connect(g); g.connect(audioCtx.destination);
  src.start();
}
function playHit() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.value = 120;
  g.gain.setValueAtTime(0.08, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.2);
}

// ================== GAME FLOW ==================
function startGame() {
  initAudio();
  state = 'playing';
  score = 0; health = 100; bombs = maxBombs;
  kills = 0; wave = 1;
  gameTime = 0; spawnTimer = 0;
  fireCooldown = 0; bombCooldown = 0;
  shake = 0; flash = 0;
  enemies = []; bullets = []; bombs_proj = []; explosions = []; particles = [];
  resetPosition();
}

function gameOver() {
  state = 'over';
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('skyStrikeHigh', highScore);
  }
}

// ================== INPUT — KEYBOARD ==================
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') {
    e.preventDefault();
    if (state === 'intro' || state === 'over') startGame();
  }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// ================== INPUT — MOUSE (ALWAYS ENABLED ON LAPTOPS) ==================
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouseX = e.clientX - r.left;
  mouseY = e.clientY - r.top;
});

canvas.addEventListener('mousedown', e => {
  if (e.button === 0 && state === 'playing') dropBomb();
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ================== INPUT — TOUCH ==================
function handleTouchStart(e) {
  // Only prevent default if this is genuinely a touch interaction
  e.preventDefault();
  initAudio();

  if (state === 'intro' || state === 'over') {
    startGame();
    return;
  }

  if (state !== 'playing') return;

  for (const touch of e.changedTouches) {
    const r = canvas.getBoundingClientRect();
    const tx = touch.clientX - r.left;
    const ty = touch.clientY - r.top;

    if (isPointInButton(tx, ty, touchButtons.bomb)) {
      touchButtons.bomb.pressed = true;
      dropBomb();
      continue;
    }

    if (isPointInButton(tx, ty, touchButtons.fire)) {
      touchButtons.fire.pressed = true;
      continue;
    }

    mouseX = tx;
    mouseY = ty;
  }
}

function handleTouchMove(e) {
  e.preventDefault();
  if (state !== 'playing') return;

  for (const touch of e.changedTouches) {
    const r = canvas.getBoundingClientRect();
    const tx = touch.clientX - r.left;
    const ty = touch.clientY - r.top;

    if (isPointInButton(tx, ty, touchButtons.bomb)) continue;

    if (!isPointInButton(tx, ty, touchButtons.fire)) {
      mouseX = tx;
      mouseY = ty;
    }
  }
}

function handleTouchEnd(e) {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    const r = canvas.getBoundingClientRect();
    const tx = touch.clientX - r.left;
    const ty = touch.clientY - r.top;

    if (isPointInButton(tx, ty, touchButtons.fire)) {
      touchButtons.fire.pressed = false;
    }
    if (isPointInButton(tx, ty, touchButtons.bomb)) {
      touchButtons.bomb.pressed = false;
    }
  }
}

canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

// ================== SPAWN ==================
function spawnEnemy() {
  const diff = 1 + gameTime / 25;
  enemies.push({
    x: (Math.random() - 0.5) * 1400,
    y: (Math.random() - 0.65) * 500,
    z: 2400,
    speed: 180 + Math.random() * 200 + diff * 40,
    hp: Math.random() < 0.2 ? 3 : (Math.random() < 0.5 ? 2 : 1),
    bank: (Math.random() - 0.5) * 0.6,
    bobPhase: Math.random() * Math.PI * 2,
    hitFlash: 0,
    dead: false
  });
}

// ================== ACTIONS ==================
function fire() {
  let best = null, bestDist = 70;
  for (const e of enemies) {
    if (e.z < 40) continue;
    const sx = cx + (e.x * F) / e.z;
    const sy = cy + (e.y * F) / e.z;
    const d = Math.hypot(sx - crosshair.x, sy - crosshair.y);
    if (d < bestDist) { bestDist = d; best = e; }
  }

  let tx = crosshair.x, ty = crosshair.y;
  if (best) {
    tx = cx + (best.x * F) / best.z;
    ty = cy + (best.y * F) / best.z;
    best.hp -= 1;
    best.hitFlash = 0.15;
    for (let i = 0; i < 4; i++) {
      const a = Math.random() * Math.PI * 2;
      particles.push({
        x: tx, y: ty,
        vx: Math.cos(a) * 80, vy: Math.sin(a) * 80,
        life: 0.2, maxLife: 0.2,
        size: 2, color: '#ffff88'
      });
    }
    if (best.hp <= 0) {
      createExplosion(tx, ty, 25 + 4000 / best.z);
      best.dead = true;
      score += 100;
      kills++;
      shake = Math.max(shake, 5);
    }
  }

  bullets.push({
    x1: cx + (Math.random() - 0.5) * 20,
    y1: H - 20,
    x2: tx, y2: ty,
    t: 0, life: 0.09
  });

  playShoot();
}

function dropBomb() {
  if (bombs <= 0 || bombCooldown > 0) return;
  bombs--;
  bombCooldown = 0.5;
  bombs_proj.push({
    x1: cx,
    y1: H - 20,
    x2: crosshair.x,
    y2: crosshair.y,
    t: 0,
    duration: 0.22
  });
}

function createExplosion(x, y, size) {
  explosions.push({ x, y, t: 0, maxT: 0.5, size });
  const n = Math.min(30, Math.floor(size / 3));
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * size * 2.5;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 0.4 + Math.random() * 0.5,
      maxLife: 0.4 + Math.random() * 0.5,
      size: 2 + Math.random() * 4,
      color: ['#ffaa33', '#ff5533', '#ffff88', '#ff8800'][Math.floor(Math.random() * 4)]
    });
  }
  playBoom();
}

// ================== UPDATE ==================
function update(dt) {
  for (const c of clouds) {
    c.x -= c.speed * dt;
    if (c.x + c.r < 0) {
      c.x = W + c.r;
      c.y = Math.random() * H * 0.65;
    }
  }

  if (state !== 'playing') return;

  gameTime += dt;
  shake = Math.max(0, shake - dt * 40);
  flash = Math.max(0, flash - dt * 2);
  fireCooldown -= dt;
  bombCooldown -= dt;

  wave = 1 + Math.floor(gameTime / 20);

  crosshair.x += (mouseX - crosshair.x) * Math.min(1, dt * 30);
  crosshair.y += (mouseY - crosshair.y) * Math.min(1, dt * 30);

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnEnemy();
    const rate = Math.max(0.25, 0.9 - wave * 0.05);
    spawnTimer = rate + Math.random() * 0.3;
  }

  // Fire from keyboard OR touch fire button
  const fireHeld = keys[' '] || touchButtons.fire.pressed;
  if (fireHeld && fireCooldown <= 0) {
    fire();
    fireCooldown = 0.11;
  }

  for (const e of enemies) {
    e.z -= e.speed * dt;
    e.bobPhase += dt * 2;
    e.y += Math.sin(e.bobPhase) * 30 * dt;
    e.hitFlash = Math.max(0, e.hitFlash - dt * 5);
    if (e.z < 40) {
      e.dead = true;
      health -= 15;
      shake = Math.max(shake, 18);
      flash = Math.max(flash, 0.4);
      playHit();
      if (health <= 0) { health = 0; gameOver(); }
    }
  }
  enemies = enemies.filter(e => !e.dead);

  for (const b of bullets) b.t += dt;
  bullets = bullets.filter(b => b.t < b.life);

  for (const bp of bombs_proj) {
    bp.t += dt;
    if (bp.t >= bp.duration) {
      const sz = 130;
      createExplosion(bp.x2, bp.y2, sz);
      shake = Math.max(shake, 22);
      flash = Math.max(flash, 0.5);
      for (const e of enemies) {
        const sx = cx + (e.x * F) / e.z;
        const sy = cy + (e.y * F) / e.z;
        if (Math.hypot(sx - bp.x2, sy - bp.y2) < sz) {
          createExplosion(sx, sy, 20);
          e.dead = true;
          score += 100;
          kills++;
        }
      }
    }
  }
  bombs_proj = bombs_proj.filter(bp => bp.t < bp.duration);

  for (const ex of explosions) ex.t += dt;
  explosions = explosions.filter(ex => ex.t < ex.maxT);

  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.95;
    p.vy *= 0.95;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
}

// ================== RENDER ==================
function render() {
  ctx.save();
  if (shake > 0.3) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  drawSky();
  drawClouds();

  if (state !== 'intro') {
    const sorted = [...enemies].sort((a, b) => b.z - a.z);
    for (const e of sorted) drawEnemy(e);
    drawBullets();
    drawBombs();
    drawExplosions();
    drawParticles();
  }

  drawCockpit();
  if (state === 'playing') {
    drawHUD();
    drawCrosshair();
    drawTouchControls();
  }

  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle = `rgba(255, 220, 150, ${flash * 0.35})`;
    ctx.fillRect(0, 0, W, H);
  }

  const vg = ctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.25, cx, cy, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  if (state === 'intro') drawIntro();
  if (state === 'over') drawGameOver();
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#061e3a');
  g.addColorStop(0.3, '#1e5090');
  g.addColorStop(0.6, '#4a90c8');
  g.addColorStop(0.85, '#8ac0dd');
  g.addColorStop(1, '#c8e0ee');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const sunX = W * 0.72, sunY = H * 0.18;
  const sg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 280);
  sg.addColorStop(0, 'rgba(255, 240, 200, 0.35)');
  sg.addColorStop(1, 'rgba(255, 240, 200, 0)');
  ctx.fillStyle = sg;
  ctx.fillRect(0, 0, W, H);
}

function drawClouds() {
  for (const c of clouds) {
    const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
    g.addColorStop(0, `rgba(255,255,255,${c.alpha})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawEnemy(e) {
  const sx = cx + (e.x * F) / e.z;
  const sy = cy + (e.y * F) / e.z;
  const size = (F / e.z) * 25;
  if (size < 1 || e.z < 5) return;
  if (sx < -300 || sx > W + 300 || sy < -300 || sy > H + 300) return;

  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(e.bank * 0.4);

  const f = e.hitFlash;
  const body = f > 0 ? '#ff6644' : '#2c3240';
  const wing = f > 0 ? '#cc3322' : '#1a1e26';
  const dark = f > 0 ? '#993300' : '#0d1015';

  ctx.fillStyle = wing;
  ctx.beginPath();
  ctx.moveTo(-size * 0.1, -size * 0.1);
  ctx.lineTo(-size * 0.9, size * 0.2);
  ctx.lineTo(-size * 0.75, size * 0.4);
  ctx.lineTo(-size * 0.1, size * 0.3);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(size * 0.1, -size * 0.1);
  ctx.lineTo(size * 0.9, size * 0.2);
  ctx.lineTo(size * 0.75, size * 0.4);
  ctx.lineTo(size * 0.1, size * 0.3);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = dark;
  ctx.beginPath();
  ctx.moveTo(-size * 0.35, size * 0.5);
  ctx.lineTo(0, size * 0.3);
  ctx.lineTo(size * 0.35, size * 0.5);
  ctx.lineTo(size * 0.3, size * 0.75);
  ctx.lineTo(-size * 0.3, size * 0.75);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(0, -size * 0.85);
  ctx.lineTo(size * 0.14, -size * 0.1);
  ctx.lineTo(size * 0.1, size * 0.55);
  ctx.lineTo(-size * 0.1, size * 0.55);
  ctx.lineTo(-size * 0.14, -size * 0.1);
  ctx.closePath(); ctx.fill();

  const cg = ctx.createLinearGradient(-size * 0.08, -size * 0.4, size * 0.08, -size * 0.2);
  cg.addColorStop(0, f > 0 ? '#ffff88' : '#88ccff');
  cg.addColorStop(1, f > 0 ? '#ffaa00' : '#335588');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.ellipse(0, -size * 0.35, size * 0.09, size * 0.18, 0, 0, Math.PI * 2);
  ctx.fill();

  if (size > 5) {
    const eg = ctx.createRadialGradient(0, size * 0.6, 0, 0, size * 0.6, size * 0.25);
    eg.addColorStop(0, 'rgba(255,200,100,0.9)');
    eg.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.fillStyle = eg;
    ctx.beginPath();
    ctx.arc(0, size * 0.6, size * 0.25, 0, Math.PI * 2);
    ctx.fill();
  }

  if (size > 14 && e.hp > 1) {
    ctx.fillStyle = '#ff3344';
    for (let i = 0; i < e.hp; i++) {
      ctx.beginPath();
      ctx.arc(-10 + i * 10, -size * 0.95, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.restore();
}

function drawBullets() {
  for (const b of bullets) {
    const p = b.t / b.life;
    const x = b.x1 + (b.x2 - b.x1) * p;
    const y = b.y1 + (b.y2 - b.y1) * p;
    const tp = Math.max(0, p - 0.3);
    const tx = b.x1 + (b.x2 - b.x1) * tp;
    const ty = b.y1 + (b.y2 - b.y1) * tp;

    ctx.strokeStyle = `rgba(255, 240, 150, ${1 - p})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(x, y);
    ctx.stroke();

    ctx.fillStyle = `rgba(255, 255, 220, ${1 - p})`;
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawBombs() {
  for (const bp of bombs_proj) {
    const p = bp.t / bp.duration;
    const x = bp.x1 + (bp.x2 - bp.x1) * p;
    const y = bp.y1 + (bp.y2 - bp.y1) * p;

    for (let i = 1; i <= 5; i++) {
      const tp = Math.max(0, p - i * 0.06);
      const tx = bp.x1 + (bp.x2 - bp.x1) * tp;
      const ty = bp.y1 + (bp.y2 - bp.y1) * tp;
      ctx.fillStyle = `rgba(200, 200, 200, ${0.4 * (1 - i / 6)})`;
      ctx.beginPath();
      ctx.arc(tx, ty, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    ctx.translate(x, y);
    const ang = Math.atan2(bp.y2 - bp.y1, bp.x2 - bp.x1);
    ctx.rotate(ang);
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.ellipse(0, 0, 6, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#666';
    ctx.beginPath();
    ctx.moveTo(-5, -10); ctx.lineTo(5, -10);
    ctx.lineTo(4, -15); ctx.lineTo(-4, -15);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#cc3322';
    ctx.fillRect(-7, 6, 14, 3);
    ctx.fillStyle = 'rgba(255, 200, 100, 0.7)';
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawExplosions() {
  for (const ex of explosions) {
    const p = ex.t / ex.maxT;
    const r = ex.size * (0.3 + p * 1.3);
    const a = 1 - p;
    const g = ctx.createRadialGradient(ex.x, ex.y, 0, ex.x, ex.y, r);
    g.addColorStop(0, `rgba(255, 255, 220, ${a})`);
    g.addColorStop(0.25, `rgba(255, 220, 100, ${a * 0.95})`);
    g.addColorStop(0.55, `rgba(255, 100, 30, ${a * 0.75})`);
    g.addColorStop(1, 'rgba(150, 30, 0, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawCrosshair() {
  const x = crosshair.x, y = crosshair.y;
  const r = 20;

  const g = ctx.createRadialGradient(x, y, 0, x, y, r + 10);
  g.addColorStop(0, 'rgba(120, 255, 160, 0.15)');
  g.addColorStop(1, 'rgba(120, 255, 160, 0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r + 10, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = 'rgba(120, 255, 160, 0.9)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.stroke();

  const b = 8;
  for (const [dx, dy] of [[-1,-1],[1,-1],[-1,1],[1,1]]) {
    ctx.beginPath();
    ctx.moveTo(x + dx * (r - b), y + dy * r);
    ctx.lineTo(x + dx * r, y + dy * r);
    ctx.lineTo(x + dx * r, y + dy * (r - b));
    ctx.stroke();
  }

  ctx.fillStyle = 'rgba(120, 255, 160, 0.9)';
  ctx.beginPath();
  ctx.arc(x, y, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = 'rgba(120, 255, 160, 0.5)';
  ctx.beginPath();
  ctx.moveTo(x - r - 12, y); ctx.lineTo(x - r - 3, y);
  ctx.moveTo(x + r + 3, y); ctx.lineTo(x + r + 12, y);
  ctx.moveTo(x, y - r - 12); ctx.lineTo(x, y - r - 3);
  ctx.moveTo(x, y + r + 3); ctx.lineTo(x, y + r + 12);
  ctx.stroke();
}

function drawCockpit() {
  const dashTop = H * 0.78;

  const g = ctx.createLinearGradient(0, dashTop, 0, H);
  g.addColorStop(0, '#1a1e26');
  g.addColorStop(1, '#05070a');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, H);
  ctx.lineTo(0, dashTop + 30);
  ctx.quadraticCurveTo(W * 0.5, dashTop - 60, W, dashTop + 30);
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = '#0a0d12';
  ctx.lineWidth = 26;
  ctx.beginPath();
  ctx.moveTo(-20, -20);
  ctx.lineTo(W * 0.06, H * 0.14);
  ctx.quadraticCurveTo(W * 0.5, H * 0.03, W * 0.94, H * 0.14);
  ctx.lineTo(W + 20, -20);
  ctx.stroke();

  ctx.fillStyle = '#0a0d12';
  ctx.beginPath();
  ctx.moveTo(-20, -20);
  ctx.lineTo(W * 0.06, H * 0.14);
  ctx.lineTo(W * 0.04, H * 0.82);
  ctx.lineTo(-20, H + 20);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(W + 20, -20);
  ctx.lineTo(W * 0.94, H * 0.14);
  ctx.lineTo(W * 0.96, H * 0.82);
  ctx.lineTo(W + 20, H + 20);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = 'rgba(120, 255, 160, 0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, dashTop + 30);
  ctx.quadraticCurveTo(W * 0.5, dashTop - 60, W, dashTop + 30);
  ctx.stroke();

  const panelY = H - 80;

  ctx.fillStyle = '#0d1015';
  ctx.beginPath();
  ctx.roundRect(W * 0.08, panelY, 160, 55, 6);
  ctx.fill();
  ctx.strokeStyle = '#2a3a4a';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#0d1015';
  ctx.beginPath();
  ctx.roundRect(W * 0.5 - 160, panelY + 5, 320, 45, 6);
  ctx.fill();
  ctx.strokeStyle = '#2a3a4a';
  ctx.stroke();

  ctx.fillStyle = '#0d1015';
  ctx.beginPath();
  ctx.roundRect(W - W * 0.08 - 160, panelY, 160, 55, 6);
  ctx.fill();
  ctx.strokeStyle = '#2a3a4a';
  ctx.stroke();

  ctx.save();
  ctx.translate(W * 0.5, panelY + 27);
  ctx.beginPath();
  ctx.arc(0, 0, 18, 0, Math.PI * 2);
  ctx.fillStyle = '#0a1a2a';
  ctx.fill();
  ctx.strokeStyle = '#2a5a7a';
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-14, 0); ctx.lineTo(14, 0);
  ctx.strokeStyle = '#4a9a6a';
  ctx.stroke();
  ctx.restore();
}

function drawHUD() {
  const hx = 20, hy = 20;
  const scale = Math.min(W, H) / 800;
  const baseFont = Math.max(10, 12 * scale);

  ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
  ctx.beginPath();
  ctx.roundRect(hx - 10, hy - 10, Math.max(180, 220 * scale), Math.max(75, 85 * scale), 6);
  ctx.fill();

  ctx.fillStyle = '#5a9a6a';
  ctx.font = `bold ${baseFont}px monospace`;
  ctx.textAlign = 'left';
  ctx.fillText('HULL INTEGRITY', hx, hy + 8 * scale);

  const bw = Math.max(140, 190 * scale), bh = Math.max(10, 12 * scale);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
  ctx.fillRect(hx, hy + 20 * scale, bw, bh);
  const hc = health > 60 ? '#4aff7a' : (health > 30 ? '#ffaa33' : '#ff3344');
  ctx.fillStyle = hc;
  ctx.fillRect(hx, hy + 20 * scale, bw * (health / 100), bh);
  ctx.strokeStyle = '#5a9a6a';
  ctx.strokeRect(hx, hy + 20 * scale, bw, bh);

  ctx.fillStyle = '#5a9a6a';
  ctx.fillText(health + '%', hx + bw + 10 * scale, hy + 31 * scale);

  ctx.textAlign = 'right';
  const sxp = W - 20;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
  ctx.beginPath();
  ctx.roundRect(sxp - Math.max(170, 210 * scale), 15, Math.max(170, 210 * scale), Math.max(85, 100 * scale), 6);
  ctx.fill();

  ctx.fillStyle = '#5a9a6a';
  ctx.font = `bold ${baseFont}px monospace`;
  ctx.fillText('SCORE', sxp, 35 * scale);

  ctx.fillStyle = '#aaffaa';
  ctx.font = `bold ${Math.max(18, 26 * scale)}px monospace`;
  ctx.fillText(score.toString().padStart(6, '0'), sxp, 65 * scale);

  ctx.fillStyle = '#5a9a6a';
  ctx.font = `bold ${Math.max(9, 10 * scale)}px monospace`;
  ctx.fillText('HIGH: ' + highScore.toString().padStart(6, '0'), sxp, 85 * scale);
  ctx.fillStyle = '#aaff88';
  ctx.fillText('WAVE ' + wave, sxp, 102 * scale);

  ctx.textAlign = 'left';
  ctx.fillStyle = '#5a9a6a';
  ctx.font = `bold ${baseFont}px monospace`;
  const bombStartY = touchCapable ? H - Math.max(45, Math.min(W, H) * 0.09) - 35 : H - 140;
  const bombStartX = touchCapable ? 20 : 40;
  ctx.fillText('BOMBS', bombStartX, bombStartY);

  const bombScale = Math.min(W, H) / 800;
  const bombSpacing = Math.max(20, 26 * bombScale);
  for (let i = 0; i < maxBombs; i++) {
    const bx = bombStartX + i * bombSpacing;
    const by = bombStartY + 22;
    if (i < bombs) {
      ctx.fillStyle = '#ffaa33';
      ctx.beginPath();
      ctx.ellipse(bx + 6, by + 8, 4, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#cc5522';
      ctx.fillRect(bx, by + 3, 12, 2);
    } else {
      ctx.strokeStyle = '#3a5a4a';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(bx + 6, by + 8, 4, 8, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  ctx.fillStyle = '#5a9a6a';
  ctx.font = `bold ${baseFont}px monospace`;
  ctx.fillText('KILLS: ' + kills, bombStartX, bombStartY + 55);
}

function drawTouchControls() {
  if (!touchCapable) return;

  const btn = touchButtons.fire;
  ctx.save();
  ctx.beginPath();
  ctx.arc(btn.x, btn.y, btn.r, 0, Math.PI * 2);
  const fg = ctx.createRadialGradient(btn.x, btn.y, 0, btn.x, btn.y, btn.r);
  fg.addColorStop(0, btn.pressed ? 'rgba(255, 160, 60, 0.8)' : 'rgba(90, 180, 110, 0.25)');
  fg.addColorStop(1, btn.pressed ? 'rgba(255, 120, 20, 0.4)' : 'rgba(90, 180, 110, 0.08)');
  ctx.fillStyle = fg;
  ctx.fill();
  ctx.strokeStyle = btn.pressed ? '#ffaa33' : 'rgba(120, 255, 160, 0.7)';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.strokeStyle = btn.pressed ? '#fff' : 'rgba(160, 255, 180, 0.9)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(btn.x - btn.r * 0.4, btn.y);
  ctx.lineTo(btn.x + btn.r * 0.4, btn.y);
  ctx.moveTo(btn.x, btn.y - btn.r * 0.4);
  ctx.lineTo(btn.x, btn.y + btn.r * 0.4);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(btn.x, btn.y, btn.r * 0.2, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  const bb = touchButtons.bomb;
  ctx.save();
  ctx.beginPath();
  ctx.arc(bb.x, bb.y, bb.r, 0, Math.PI * 2);
  const bg = ctx.createRadialGradient(bb.x, bb.y, 0, bb.x, bb.y, bb.r);
  bg.addColorStop(0, bb.pressed ? 'rgba(255, 160, 60, 0.8)' : 'rgba(180, 120, 90, 0.25)');
  bg.addColorStop(1, bb.pressed ? 'rgba(255, 120, 20, 0.4)' : 'rgba(180, 120, 90, 0.08)');
  ctx.fillStyle = bg;
  ctx.fill();
  ctx.strokeStyle = bb.pressed ? '#ffaa33' : 'rgba(255, 180, 120, 0.7)';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.fillStyle = bb.pressed ? '#fff' : 'rgba(255, 200, 140, 0.9)';
  ctx.beginPath();
  ctx.ellipse(bb.x, bb.y + bb.r * 0.1, bb.r * 0.25, bb.r * 0.35, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = bb.pressed ? '#fff' : 'rgba(255, 200, 140, 0.7)';
  ctx.fillRect(bb.x - bb.r * 0.25, bb.y - bb.r * 0.15, bb.r * 0.5, bb.r * 0.12);
  ctx.restore();
}

function drawIntro() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
  ctx.fillRect(0, 0, W, H);

  const scale = Math.min(W, H) / 800;
  const bigFont = Math.max(34, Math.min(72, W * 0.1));

  ctx.textAlign = 'center';
  ctx.fillStyle = '#aaffaa';
  ctx.font = `bold ${bigFont}px monospace`;
  ctx.shadowColor = '#4aff7a';
  ctx.shadowBlur = 20;
  ctx.fillText('SKY STRIKE', W / 2, H * 0.22);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#5a9a6a';
  ctx.font = `bold ${Math.max(11, 16 * scale)}px monospace`;
  ctx.fillText('C O C K P I T   C O M B A T', W / 2, H * 0.22 + bigFont * 0.45);

  ctx.fillStyle = '#ffffff';
  ctx.font = `${Math.max(13, 18 * scale)}px monospace`;
  if (touchCapable) {
    ctx.fillText('TAP  —  START GAME', W / 2, H * 0.42);
    ctx.fillText('DRAG  —  AIM CROSSHAIR', W / 2, H * 0.42 + 30);
    ctx.fillText('HOLD  FIRE BUTTON  —  SHOOT', W / 2, H * 0.42 + 60);
    ctx.fillText('TAP  BOMB BUTTON  —  DROP BOMB', W / 2, H * 0.42 + 90);
  } else {
    ctx.fillText('SPACEBAR  —  FIRE CANNONS', W / 2, H * 0.42);
    ctx.fillText('LEFT CLICK  —  DROP BOMB', W / 2, H * 0.42 + 32);
    ctx.fillText('MOUSE  —  AIM CROSSHAIR', W / 2, H * 0.42 + 64);
  }

  ctx.fillStyle = '#5a9a6a';
  ctx.font = `${Math.max(11, 14 * scale)}px monospace`;
  ctx.fillText('HIGH SCORE  ' + highScore.toString().padStart(6, '0'), W / 2, H * 0.60);

  ctx.fillStyle = '#7ab8a0';
  ctx.font = `bold ${Math.max(13, 16 * scale)}px monospace`;
  ctx.fillText('Built by Gesner Deslandes', W / 2, H * 0.68);
  ctx.fillStyle = '#5a9a6a';
  ctx.font = `${Math.max(10, 13 * scale)}px monospace`;
  ctx.fillText('Software Developer', W / 2, H * 0.68 + 22);
  ctx.fillStyle = '#8ab8a8';
  ctx.font = `${Math.max(10, 13 * scale)}px monospace`;
  ctx.fillText('Contact: (509) 47385663', W / 2, H * 0.68 + 44);
  ctx.fillText('Email: deslandes78@gmail.com', W / 2, H * 0.68 + 64);

  const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 300);
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#ffaa33';
  ctx.font = `bold ${Math.max(18, 26 * scale)}px monospace`;
  ctx.fillText(touchCapable ? 'TAP TO LAUNCH' : 'PRESS SPACEBAR TO LAUNCH', W / 2, H * 0.90);
  ctx.globalAlpha = 1;
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(20, 0, 0, 0.72)';
  ctx.fillRect(0, 0, W, H);

  const scale = Math.min(W, H) / 800;
  const bigFont = Math.max(30, Math.min(80, W * 0.11));

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff3344';
  ctx.font = `bold ${bigFont}px monospace`;
  ctx.shadowColor = '#ff3344';
  ctx.shadowBlur = 25;
  ctx.fillText('SHOT DOWN', W / 2, H * 0.32);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${Math.max(18, 28 * scale)}px monospace`;
  ctx.fillText('SCORE  ' + score, W / 2, H * 0.47);

  ctx.fillStyle = '#ffaa33';
  ctx.font = `${Math.max(14, 20 * scale)}px monospace`;
  ctx.fillText('KILLS  ' + kills, W / 2, H * 0.55);
  ctx.fillText('WAVE REACHED  ' + wave, W / 2, H * 0.61);

  if (score > 0 && score >= highScore) {
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 250);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#aaffaa';
    ctx.font = `bold ${Math.max(18, 24 * scale)}px monospace`;
    ctx.fillText('★ NEW HIGH SCORE ★', W / 2, H * 0.70);
    ctx.globalAlpha = 1;
  } else {
    ctx.fillStyle = '#5a9a6a';
    ctx.font = `${Math.max(12, 16 * scale)}px monospace`;
    ctx.fillText('HIGH SCORE  ' + highScore.toString().padStart(6, '0'), W / 2, H * 0.70);
  }

  const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 300);
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#ffaa33';
  ctx.font = `bold ${Math.max(16, 22 * scale)}px monospace`;
  ctx.fillText(touchCapable ? 'TAP TO FLY AGAIN' : 'PRESS SPACEBAR TO FLY AGAIN', W / 2, H * 0.88);
  ctx.globalAlpha = 1;
}

// ================== LOOP ==================
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

lastTime = performance.now();
requestAnimationFrame(loop);
</script>
</body>
</html>
